<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Skill Gap Agent</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 85%;
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f8fafc;
            border-left: 5px solid #2563eb;
            border-radius: 7px;
            white-space: pre-wrap;
            line-height: 1.6;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AI Skill Gap Agent</h1>

    <p class="subtitle">
        Analyze your skills and find what you need to learn for your target job.
    </p>

    <form method="POST">

        <label for="student_skills">
            Your Current Skills
        </label>

        <textarea
            id="student_skills"
            name="student_skills"
            placeholder="Example: Python, SQL, Machine Learning, Pandas"
            required></textarea>


        <label for="target_role">
            Target Job Role
        </label>

        <input
            type="text"
            id="target_role"
            name="target_role"
            placeholder="Example: Machine Learning Engineer"
            required>


        <label for="job_description">
            Job Description / Required Skills
        </label>

        <textarea
            id="job_description"
            name="job_description"
            placeholder="Paste the job description or required skills here..."
            required></textarea>


        <button type="submit">
            Analyze Skill Gap
        </button>

    </form>


    {% if result %}

    <div class="result">
        <h2>AI Skill Gap Analysis</h2>

        {{ result }}

    </div>

    {% endif %}

</div>

</body>
</html>
```
